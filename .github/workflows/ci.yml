name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancela runs anteriores del mismo PR/rama cuando llegan commits nuevos,
# para no gastar minutos ejecutando codigo ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint notebook structure
        run: python scripts/lint_notebook_structure.py --path .
      - name: Quality gate (dataset de ejemplo)
        run: python scripts/quality_gate.py 04-recursos/datasets/ejemplo_ventas.csv
      - name: Unit tests
        run: pytest tests/ -v

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ejecutar notebooks
        run: pytest --nbmake --nbmake-timeout=600 01-nivel-junior 02-nivel-mid 03-nivel-senior
