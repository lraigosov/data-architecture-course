name: Dependency Review

# Bloquea un PR si introduce una dependencia con una vulnerabilidad conocida.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
